<script>const DATA={"stories":[{"id":"noe","name":"Noé","title":"Construir antes de ver","era":"Comienzos","place":"Antes del Diluvio","value":"Constancia","reference":"Génesis 6:9–22; 7:1–16","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/génesis/6/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/2/arca-de-noe/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016015/univ/art/1102016015_univ_sqr_xl.jpg","summary":"En un mundo violento, Noé decidió escuchar a Jehová. Recibió instrucciones para construir un arca y las llevó a la práctica con su familia. El relato destaca una fe que se expresaba en trabajo constante, no solo en palabras. No se conoce con certeza el lugar donde construyeron el arca.","sequence":["Jehová da instrucciones a Noé.","Noé construye el arca.","La familia y los animales entran.","Llega el Diluvio."],"clues":["Mi tarea requirió constancia antes de ver el resultado.","Mi familia trabajó conmigo en una gran construcción.","Construí un arca siguiendo las instrucciones de Jehová."],"quizzes":[{"question":"¿Qué demostró la fe de Noé?","options":["Llevar a la práctica lo que Jehová le indicó.","Esperar sin hacer nada.","Construir una torre para hacerse famoso."],"correct":0,"id":"noe-1","explanation":"En un mundo violento, Noé decidió escuchar a Jehová. Recibió instrucciones para construir un arca y las llevó a la práctica con su familia. El relato destaca una fe que se expresaba en trabajo constante, no solo en palabras. No se conoce con certeza el lugar donde construyeron el arca.","reference":"Génesis 6:9–22; 7:1–16"},{"id":"noe-2","question":"¿Quién trabajó con Noé en el encargo?","options":["Su familia.","Los habitantes de Nínive.","El rey de Egipto."],"correct":0,"explanation":"En esta lectura: Su familia. Consulta Génesis 6:9–22; 7:1–16 para situarlo en su contexto.","reference":"Génesis 6:9–22; 7:1–16"},{"id":"noe-3","question":"¿Qué recibió Noé antes de comenzar?","options":["Instrucciones para construir el arca.","Una orden de viajar a Roma.","Una invitación a un banquete."],"correct":0,"explanation":"En esta lectura: Instrucciones para construir el arca. Consulta Génesis 6:9–22; 7:1–16 para situarlo en su contexto.","reference":"Génesis 6:9–22; 7:1–16"},{"id":"noe-4","question":"¿Qué entró en el arca junto con la familia?","options":["Los animales.","Un ejército.","Todos los habitantes de la tierra."],"correct":0,"explanation":"En esta lectura: Los animales. Consulta Génesis 6:9–22; 7:1–16 para situarlo en su contexto.","reference":"Génesis 6:9–22; 7:1–16"},{"id":"noe-5","question":"¿Qué rasgo del relato expresa constancia?","options":["Seguir trabajando para cumplir el encargo.","Esperar a que otros hicieran todo.","Buscar únicamente reconocimiento."],"correct":0,"explanation":"En esta lectura: Seguir trabajando para cumplir el encargo. Consulta Génesis 6:9–22; 7:1–16 para situarlo en su contexto.","reference":"Génesis 6:9–22; 7:1–16"}],"modern":{"context":"Hogar","situation":"En casa acordaron estudiar juntos, pero después de varios días les cuesta mantener la costumbre.","options":["Elegir una hora realista y repartir pequeñas tareas.","Intentar hacerlo todo de golpe un solo día.","Dejarlo hasta que a todos les sobre tiempo."],"correct":0,"explanation":"La constancia crece con pasos posibles y un propósito compartido. La aplicación es una propuesta del juego, no una instrucción dada a Noé.","action":"Acordar una pequeña rutina que puedan sostener esta semana.","talk":"¿Qué tarea sale mejor cuando colaboramos sin esperar resultados inmediatos?","responses":["Un horario realista permite que cada persona sepa cómo colaborar. No hace falta empezar con una rutina perfecta.","Concentrarlo todo en un solo día podría resultar agotador. La constancia necesita un ritmo que sí puedan mantener.","Esperar a que sobre tiempo puede dejar el acuerdo sin empezar. Una tarea pequeña ofrece un comienzo más concreto."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"forest","bridge":{"past":"Llega el Diluvio.","value":"Constancia","today":"En casa acordaron estudiar juntos, pero después de varios días les cuesta mantener la costumbre.","action":"Acordar una pequeña rutina que puedan sostener esta semana."}},{"id":"abrahan","name":"Abrahán y Sara","title":"El valor del primer paso","era":"Patriarcas","place":"De Ur a Canaán","value":"Confianza","reference":"Génesis 12:1–9","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/génesis/12/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/3/abrahan-sara/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016018/univ/art/1102016018_univ_sqr_xl.jpg","summary":"Abrahán y Sara dejaron una vida conocida para seguir la dirección de Jehová. Su recorrido pasó por Harán y continuó hacia Canaán. No tuvieron todas las respuestas por adelantado, pero su confianza influyó en sus decisiones. El relato no convierte cualquier mudanza o incertidumbre en un mandato divino.","sequence":["Viven en Ur.","Salen y llegan a Harán.","Abrahán continúa hacia Canaán.","Recorre la tierra y vive en tiendas."],"clues":["Dejé una ciudad y aprendí a vivir en tiendas.","Sara me acompañó en un largo viaje.","Salí de Ur y recibí una promesa sobre mi descendencia."],"quizzes":[{"question":"¿Qué lugar formó parte del viaje antes de llegar a Canaán?","options":["Harán.","Filipos.","Roma."],"correct":0,"id":"abrahan-1","explanation":"Abrahán y Sara dejaron una vida conocida para seguir la dirección de Jehová. Su recorrido pasó por Harán y continuó hacia Canaán. No tuvieron todas las respuestas por adelantado, pero su confianza influyó en sus decisiones. El relato no convierte cualquier mudanza o incertidumbre en un mandato divino.","reference":"Génesis 12:1–9"},{"id":"abrahan-2","question":"¿Desde qué ciudad comenzó el recorrido de esta lectura?","options":["Ur.","Jope.","Jericó."],"correct":0,"explanation":"En esta lectura: Ur. Consulta Génesis 12:1–9 para situarlo en su contexto.","reference":"Génesis 12:1–9"},{"id":"abrahan-3","question":"¿Quién acompañó a Abrahán en esta nueva etapa?","options":["Sara.","Dorcas.","Ester."],"correct":0,"explanation":"En esta lectura: Sara. Consulta Génesis 12:1–9 para situarlo en su contexto.","reference":"Génesis 12:1–9"},{"id":"abrahan-4","question":"¿Hacia qué tierra continuó Abrahán después de Harán?","options":["Canaán.","Macedonia.","Asiria."],"correct":0,"explanation":"En esta lectura: Canaán. Consulta Génesis 12:1–9 para situarlo en su contexto.","reference":"Génesis 12:1–9"},{"id":"abrahan-5","question":"¿Cómo vivía mientras recorría aquella tierra?","options":["En tiendas.","En el palacio de Egipto.","En un barco de guerra."],"correct":0,"explanation":"En esta lectura: En tiendas. Consulta Génesis 12:1–9 para situarlo en su contexto.","reference":"Génesis 12:1–9"}],"modern":{"context":"Cambios","situation":"Tu familia se muda y te preocupa no conocer a nadie en el nuevo lugar.","options":["Hablar de lo que preocupa y preparar juntos el primer paso.","Fingir que nadie siente miedo.","Pensar que todos los cambios siempre saldrán mal."],"correct":0,"explanation":"Expresar lo que sentimos y buscar apoyo permite afrontar cambios con más serenidad. Confiar no equivale a ignorar los preparativos prácticos.","action":"Escribir una preocupación y una acción concreta para afrontarla.","talk":"¿Cómo podemos acompañar a quien está empezando una etapa nueva?","responses":["Hablar del miedo permite preparar juntos la nueva etapa sin fingir seguridad.","Ocultar el miedo puede impedir que recibas apoyo. Reconocer una preocupación no te hace menos valiente.","Anticipar solo resultados negativos puede aumentar la incertidumbre. Puedes reconocer riesgos y preparar un primer paso."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"desert","bridge":{"past":"Recorre la tierra y vive en tiendas.","value":"Confianza","today":"Tu familia se muda y te preocupa no conocer a nadie en el nuevo lugar.","action":"Escribir una preocupación y una acción concreta para afrontarla."}},{"id":"jose","name":"José","title":"Reservas para el mañana","era":"Patriarcas","place":"Egipto","value":"Previsión y perdón","reference":"Génesis 41:25–57; 45:1–15","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/génesis/41/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/4/suenos-faraon/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016025/univ/art/1102016025_univ_sqr_xl.jpg","summary":"José explicó al faraón que habría años de abundancia seguidos de hambre. Organizó reservas de alimento que después ayudaron a muchas personas. Cuando sus hermanos llegaron a Egipto, no se dejó dominar por la venganza. Su historia permite reflexionar tanto sobre la previsión como sobre el perdón.","sequence":["El faraón tiene sueños.","José explica su significado.","Se almacena alimento en años de abundancia.","Se distribuye alimento durante la escasez."],"clues":["Pasé de estar preso a administrar alimentos.","Mis hermanos llegaron a pedirme ayuda sin reconocerme.","Organicé reservas de grano en Egipto."],"quizzes":[{"question":"¿Cuándo se almacenó el alimento?","options":["Durante los años de abundancia.","Después de que terminara toda la escasez.","Solo cuando llegaron los hermanos de José."],"correct":0,"id":"jose-1","explanation":"José explicó al faraón que habría años de abundancia seguidos de hambre. Organizó reservas de alimento que después ayudaron a muchas personas. Cuando sus hermanos llegaron a Egipto, no se dejó dominar por la venganza. Su historia permite reflexionar tanto sobre la previsión como sobre el perdón.","reference":"Génesis 41:25–57; 45:1–15"},{"id":"jose-2","question":"¿Quién tuvo los sueños que José explicó?","options":["El faraón.","Uno de los hermanos de José.","El rey de Nínive."],"correct":0,"explanation":"En esta lectura: El faraón. Consulta Génesis 41:25–57; 45:1–15 para situarlo en su contexto.","reference":"Génesis 41:25–57; 45:1–15"},{"id":"jose-3","question":"¿Qué vendría después de los años de abundancia?","options":["Años de hambre.","Una cosecha cada día.","La desaparición de todas las ciudades."],"correct":0,"explanation":"En esta lectura: Años de hambre. Consulta Génesis 41:25–57; 45:1–15 para situarlo en su contexto.","reference":"Génesis 41:25–57; 45:1–15"},{"id":"jose-4","question":"¿A quién ayudaron las reservas durante la escasez?","options":["A muchas personas que necesitaban alimento.","Solo a José.","Únicamente a quienes llevaban regalos."],"correct":0,"explanation":"En esta lectura: A muchas personas que necesitaban alimento. Consulta Génesis 41:25–57; 45:1–15 para situarlo en su contexto.","reference":"Génesis 41:25–57; 45:1–15"},{"id":"jose-5","question":"¿Qué evitó José cuando volvieron sus hermanos?","options":["Dejarse dominar por la venganza.","Escuchar lo que necesitaban.","Reconocer a su familia."],"correct":0,"explanation":"En esta lectura: Dejarse dominar por la venganza. Consulta Génesis 41:25–57; 45:1–15 para situarlo en su contexto.","reference":"Génesis 41:25–57; 45:1–15"}],"modern":{"context":"Familia","situation":"Tu hermano reconoce que estropeó algo tuyo y propone repararlo. Todavía te sientes molesto.","options":["Escuchar su disculpa y acordar cómo reparar el daño.","Recordárselo en cada conversación.","Romper algo suyo para equilibrar las cosas."],"correct":0,"explanation":"El perdón no niega el daño ni elimina la necesidad de repararlo. El ejemplo de José invita a no convertir el resentimiento en venganza.","action":"Practicar una frase para hablar de un desacuerdo sin atacar a la persona.","talk":"¿Qué diferencia hay entre perdonar, recuperar la confianza y reparar un daño?","responses":["Escuchar y acordar una reparación permite atender el daño sin usarlo como un arma. La confianza puede recuperarse poco a poco.","Recordar el error en cada conversación podría mantener abierto el conflicto sin resolver la reparación.","Dañar algo suyo sumaría otro problema. Puedes expresar tu enfado y poner límites sin vengarte."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"egypt","bridge":{"past":"Se distribuye alimento durante la escasez.","value":"Previsión y perdón","today":"Tu hermano reconoce que estropeó algo tuyo y propone repararlo. Todavía te sientes molesto.","action":"Practicar una frase para hablar de un desacuerdo sin atacar a la persona."}},{"id":"moises","name":"Moisés","title":"Un paso entre las aguas","era":"Éxodo","place":"Mar Rojo","value":"Confianza y calma","reference":"Éxodo 14:10–31","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/éxodo/14/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/4/mar-rojo-se-divide/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016032/univ/art/1102016032_univ_sqr_xl.jpg","summary":"Los israelitas se encontraron entre el mar y el ejército egipcio. Moisés los animó a confiar en Jehová. Según el relato, Jehová abrió un camino por el mar y el pueblo cruzó sobre terreno seco. La Biblia atribuye la liberación a Dios; ningún reto del juego reproduce ese milagro.","sequence":["El pueblo sale de Egipto.","Los egipcios lo persiguen.","Jehová abre un camino por el mar.","Los israelitas cruzan."],"clues":["Guié a un pueblo que había vivido en esclavitud.","Animé a los israelitas cuando parecían no tener salida.","Extendí mi mano sobre el mar siguiendo la dirección de Jehová."],"quizzes":[{"question":"¿A quién atribuye el relato la liberación?","options":["A Jehová.","A la habilidad del jugador.","A las provisiones del pueblo."],"correct":0,"id":"moises-1","explanation":"Los israelitas se encontraron entre el mar y el ejército egipcio. Moisés los animó a confiar en Jehová. Según el relato, Jehová abrió un camino por el mar y el pueblo cruzó sobre terreno seco. La Biblia atribuye la liberación a Dios; ningún reto del juego reproduce ese milagro.","reference":"Éxodo 14:10–31"},{"id":"moises-2","question":"¿Entre qué dos obstáculos se encontraba el pueblo?","options":["El mar y el ejército egipcio.","Dos montañas de hielo.","Una muralla y un bosque."],"correct":0,"explanation":"En esta lectura: El mar y el ejército egipcio. Consulta Éxodo 14:10–31 para situarlo en su contexto.","reference":"Éxodo 14:10–31"},{"id":"moises-3","question":"¿Qué animó Moisés a hacer al pueblo?","options":["Confiar en Jehová.","Volver para atacar Egipto.","Confiar solo en sus provisiones."],"correct":0,"explanation":"En esta lectura: Confiar en Jehová. Consulta Éxodo 14:10–31 para situarlo en su contexto.","reference":"Éxodo 14:10–31"},{"id":"moises-4","question":"¿Cómo cruzaron los israelitas según el relato?","options":["Por terreno seco.","Nadando en grupos.","En barcos construidos por ellos."],"correct":0,"explanation":"En esta lectura: Por terreno seco. Consulta Éxodo 14:10–31 para situarlo en su contexto.","reference":"Éxodo 14:10–31"},{"id":"moises-5","question":"¿Qué sucedió antes de que el pueblo cruzara?","options":["Se abrió un camino por el mar.","Construyeron un puente.","El ejército dejó de perseguirlos para siempre."],"correct":0,"explanation":"En esta lectura: Se abrió un camino por el mar. Consulta Éxodo 14:10–31 para situarlo en su contexto.","reference":"Éxodo 14:10–31"}],"modern":{"context":"Preocupación","situation":"Tienes varias tareas pendientes y pensar en todas a la vez te bloquea.","options":["Hacer una pausa, orar y ordenar el siguiente paso.","Decidir que nada tiene solución.","Responder mal a quien intenta ayudarte."],"correct":0,"explanation":"Podemos buscar calma, apoyo y dirección antes de actuar. El relato no promete que hoy todos los problemas se resuelvan milagrosamente.","action":"Dividir una tarea grande en tres acciones pequeñas.","talk":"¿Qué palabras ayudan cuando alguien se siente atrapado por sus preocupaciones?","responses":["Una pausa y un siguiente paso manejable pueden ayudarte a salir del bloqueo. Pedir apoyo también es válido.","Pensar que nada tiene solución podría impedirte identificar una parte que sí puedes resolver.","Responder mal puede alejar a quien intenta acompañarte. Puedes pedir unos minutos antes de hablar."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"coast","bridge":{"past":"Los israelitas cruzan.","value":"Confianza y calma","today":"Tienes varias tareas pendientes y pensar en todas a la vez te bloquea.","action":"Dividir una tarea grande en tres acciones pequeñas."}},{"id":"rahab","name":"Rahab","title":"Una decisión con valor","era":"Conquista y jueces","place":"Jericó","value":"Valor","reference":"Josué 2:1–21; 6:22–25","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/josué/2/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/6/rahab-esconde-espias/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016040/univ/art/1102016040_univ_sqr_xl.jpg","summary":"Rahab reconoció el poder de Jehová y ayudó a los mensajeros israelitas. Siguió las instrucciones relacionadas con una cuerda de color rojo y reunió a su familia en su casa. Su historia destaca una confianza que se convirtió en acciones. La aplicación actual se centra en el valor, no en imitar operaciones de espionaje.","sequence":["Llegan dos mensajeros a Jericó.","Rahab les presta ayuda.","Recibe y sigue las instrucciones sobre la cuerda.","Rahab y su familia son rescatados."],"clues":["Vivía en una ciudad amurallada.","Ayudé a dos mensajeros y pensé en mi familia.","Una cuerda roja identificó mi casa en Jericó."],"quizzes":[{"question":"¿En qué ciudad vivía Rahab?","options":["Jericó.","Belén.","Jope."],"correct":0,"id":"rahab-1","explanation":"Rahab reconoció el poder de Jehová y ayudó a los mensajeros israelitas. Siguió las instrucciones relacionadas con una cuerda de color rojo y reunió a su familia en su casa. Su historia destaca una confianza que se convirtió en acciones. La aplicación actual se centra en el valor, no en imitar operaciones de espionaje.","reference":"Josué 2:1–21; 6:22–25"},{"id":"rahab-2","question":"¿A quiénes ayudó Rahab?","options":["A dos mensajeros israelitas.","Al faraón y su familia.","A unos mercaderes de Roma."],"correct":0,"explanation":"En esta lectura: A dos mensajeros israelitas. Consulta Josué 2:1–21; 6:22–25 para situarlo en su contexto.","reference":"Josué 2:1–21; 6:22–25"},{"id":"rahab-3","question":"¿De qué color era la cuerda mencionada?","options":["Rojo.","Azul.","Blanco."],"correct":0,"explanation":"En esta lectura: Rojo. Consulta Josué 2:1–21; 6:22–25 para situarlo en su contexto.","reference":"Josué 2:1–21; 6:22–25"},{"id":"rahab-4","question":"¿Dónde reunió Rahab a su familia?","options":["En su casa.","En un campamento lejano.","En el palacio de Babilonia."],"correct":0,"explanation":"En esta lectura: En su casa. Consulta Josué 2:1–21; 6:22–25 para situarlo en su contexto.","reference":"Josué 2:1–21; 6:22–25"},{"id":"rahab-5","question":"¿Qué dio contenido a la confianza de Rahab?","options":["Actuar de acuerdo con lo que había reconocido.","Decir que creía sin hacer nada.","Esperar a que otros decidieran por ella."],"correct":0,"explanation":"En esta lectura: Actuar de acuerdo con lo que había reconocido. Consulta Josué 2:1–21; 6:22–25 para situarlo en su contexto.","reference":"Josué 2:1–21; 6:22–25"}],"modern":{"context":"Escuela","situation":"Alguien queda excluido de una actividad y te preocupa que se burlen de ti si lo incluyes.","options":["Invitarlo con respeto y pedir apoyo a un adulto si hay acoso.","Unirte a la burla para pasar inadvertido.","Decir que ayudarás, pero no hacer nada."],"correct":0,"explanation":"El valor puede mostrarse con una acción tranquila y segura. No hace falta exponerse al peligro para tratar bien a otra persona.","action":"Pensar en una manera segura de incluir a alguien.","talk":"¿Cuándo una pequeña acción requiere mucho valor?","responses":["Invitar con respeto favorece la inclusión. Ante acoso, buscar apoyo es parte del valor, no una falta de él.","Sumarte a la burla puede agravar el daño a esa persona aunque momentáneamente te proteja de las críticas.","Una promesa sin acción no cambia la exclusión. Busca un gesto seguro y posible."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"city","bridge":{"past":"Rahab y su familia son rescatados.","value":"Valor","today":"Alguien queda excluido de una actividad y te preocupa que se burlen de ti si lo incluyes.","action":"Pensar en una manera segura de incluir a alguien."}},{"id":"rut","name":"Rut y Noemí","title":"Nadie camina sola","era":"Conquista y jueces","place":"Moab y Belén","value":"Lealtad","reference":"Rut 1:16–22; 2:1–17","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/rut/2/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/6/rut-noemi/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016043/univ/art/1102016043_univ_sqr_xl.jpg","summary":"Rut acompañó a Noemí cuando regresó a Belén. Para conseguir alimento recogió espigas en el campo de Boaz, quien la trató con consideración. Su cariño no quedó en una promesa: se expresó en compañía y trabajo cotidiano. Noemí también compartió orientación y experiencia con Rut.","sequence":["Noemí decide regresar a Belén.","Rut elige acompañarla.","Llegan al comienzo de la cosecha.","Rut recoge espigas en el campo de Boaz."],"clues":["Dejé Moab para acompañar a alguien que quería.","Recogí espigas para ayudar a mi familia.","No abandoné a Noemí."],"quizzes":[{"question":"¿En el campo de quién recogió espigas Rut?","options":["Boaz.","Naamán.","Darío."],"correct":0,"id":"rut-1","explanation":"Rut acompañó a Noemí cuando regresó a Belén. Para conseguir alimento recogió espigas en el campo de Boaz, quien la trató con consideración. Su cariño no quedó en una promesa: se expresó en compañía y trabajo cotidiano. Noemí también compartió orientación y experiencia con Rut.","reference":"Rut 1:16–22; 2:1–17"},{"id":"rut-2","question":"¿A quién decidió acompañar Rut?","options":["A Noemí.","A Ester.","A María."],"correct":0,"explanation":"En esta lectura: A Noemí. Consulta Rut 1:16–22; 2:1–17 para situarlo en su contexto.","reference":"Rut 1:16–22; 2:1–17"},{"id":"rut-3","question":"¿A qué ciudad regresó Noemí con Rut?","options":["A Belén.","A Nínive.","A Susa."],"correct":0,"explanation":"En esta lectura: A Belén. Consulta Rut 1:16–22; 2:1–17 para situarlo en su contexto.","reference":"Rut 1:16–22; 2:1–17"},{"id":"rut-4","question":"¿Qué hizo Rut para conseguir alimento?","options":["Recogió espigas.","Vendió púrpura.","Administró las reservas del faraón."],"correct":0,"explanation":"En esta lectura: Recogió espigas. Consulta Rut 1:16–22; 2:1–17 para situarlo en su contexto.","reference":"Rut 1:16–22; 2:1–17"},{"id":"rut-5","question":"¿Qué hizo Boaz por Rut en este episodio?","options":["La trató con consideración.","La obligó a marcharse.","Le pidió que abandonara a Noemí."],"correct":0,"explanation":"En esta lectura: La trató con consideración. Consulta Rut 1:16–22; 2:1–17 para situarlo en su contexto.","reference":"Rut 1:16–22; 2:1–17"}],"modern":{"context":"Familia","situation":"Un familiar mayor está solo y últimamente casi nadie lo visita.","options":["Preguntar qué necesita y acordar una visita o llamada.","Suponer que prefiere estar siempre solo.","Prometer algo que sabemos que no cumpliremos."],"correct":0,"explanation":"La lealtad se reconoce en el cuidado constante. Escuchar qué ayuda necesita la persona evita decidir todo por ella.","action":"Organizar un gesto de compañía que realmente puedan cumplir.","talk":"¿Cómo demostramos cariño cuando ya pasó el primer momento de preocupación?","responses":["Preguntar permite ofrecer la compañía que esa persona desea y cumplir un compromiso realista.","Suponer que prefiere la soledad podría dejar sin escuchar una necesidad. Conviene preguntarle.","Una promesa que no puedes cumplir puede producir desilusión. Ofrece menos, pero hazlo de verdad."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"field","bridge":{"past":"Rut recoge espigas en el campo de Boaz.","value":"Lealtad","today":"Un familiar mayor está solo y últimamente casi nadie lo visita.","action":"Organizar un gesto de compañía que realmente puedan cumplir."}},{"id":"samuel","name":"Samuel","title":"Aprender a escuchar","era":"Conquista y jueces","place":"Siló","value":"Atención","reference":"1 Samuel 3:1–10","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/1-samuel/3/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/6/dios-llama-samuel/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016047/univ/art/1102016047_univ_sqr_xl.jpg","summary":"Samuel servía en el tabernáculo junto a Elí. Una noche oyó que lo llamaban y, al principio, pensó que era Elí. Con su ayuda entendió quién lo estaba llamando y se dispuso a escuchar. El relato presenta un episodio particular; no enseña a interpretar cualquier voz o pensamiento como un mensaje divino.","sequence":["Samuel oye que lo llaman.","Va a ver a Elí.","Elí comprende lo que sucede y lo orienta.","Samuel se dispone a escuchar a Jehová."],"clues":["De joven servía junto a un hombre llamado Elí.","Una noche pensé varias veces que él me llamaba.","Aprendí a escuchar un mensaje de Jehová en Siló."],"quizzes":[{"question":"¿Quién ayudó a Samuel a entender lo que ocurría?","options":["Elí.","Boaz.","Jonás."],"correct":0,"id":"samuel-1","explanation":"Samuel servía en el tabernáculo junto a Elí. Una noche oyó que lo llamaban y, al principio, pensó que era Elí. Con su ayuda entendió quién lo estaba llamando y se dispuso a escuchar. El relato presenta un episodio particular; no enseña a interpretar cualquier voz o pensamiento como un mensaje divino.","reference":"1 Samuel 3:1–10"},{"id":"samuel-2","question":"¿Dónde servía Samuel?","options":["En el tabernáculo.","En el palacio del faraón.","En un barco en Galilea."],"correct":0,"explanation":"En esta lectura: En el tabernáculo. Consulta 1 Samuel 3:1–10 para situarlo en su contexto.","reference":"1 Samuel 3:1–10"},{"id":"samuel-3","question":"¿A quién fue a ver Samuel al oír que lo llamaban?","options":["A Elí.","A David.","A Nehemías."],"correct":0,"explanation":"En esta lectura: A Elí. Consulta 1 Samuel 3:1–10 para situarlo en su contexto.","reference":"1 Samuel 3:1–10"},{"id":"samuel-4","question":"¿Cuándo ocurrió el episodio de esta lectura?","options":["Una noche.","Durante un banquete real.","Durante la cosecha de Rut."],"correct":0,"explanation":"En esta lectura: Una noche. Consulta 1 Samuel 3:1–10 para situarlo en su contexto.","reference":"1 Samuel 3:1–10"},{"id":"samuel-5","question":"Tras recibir orientación, ¿qué hizo Samuel?","options":["Se dispuso a escuchar a Jehová.","Decidió ignorar la llamada.","Se marchó a Nínive."],"correct":0,"explanation":"En esta lectura: Se dispuso a escuchar a Jehová. Consulta 1 Samuel 3:1–10 para situarlo en su contexto.","reference":"1 Samuel 3:1–10"}],"modern":{"context":"Hogar","situation":"Mientras alguien te explica algo importante, sigues mirando el teléfono.","options":["Guardar el teléfono y confirmar que entendiste.","Responder sin haber escuchado.","Interrumpir para terminar más rápido."],"correct":0,"explanation":"Escuchar con atención es una forma de respeto. Preguntar cuando no entendemos evita suposiciones.","action":"Dejar las pantallas a un lado durante una conversación.","talk":"¿Cómo notas que otra persona te está escuchando de verdad?","responses":["Guardar el teléfono y confirmar lo entendido hace visible tu atención.","Responder sin escuchar puede generar errores y hacer que la otra persona no se sienta atendida.","Interrumpir para terminar antes puede impedir comprender lo importante. Pide una aclaración con calma."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"courtyard","bridge":{"past":"Samuel se dispone a escuchar a Jehová.","value":"Atención","today":"Mientras alguien te explica algo importante, sigues mirando el teléfono.","action":"Dejar las pantallas a un lado durante una conversación."}},{"id":"jonatan","name":"David y Jonatán","title":"La amistad no compite","era":"Reyes y profetas","place":"Israel","value":"Amistad","reference":"1 Samuel 18:1–4; 23:16–18","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/1-samuel/18/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/7/jonatan-david/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016052/univ/art/1102016052_univ_sqr_xl.jpg","summary":"Jonatán era hijo del rey Saúl, pero no trató a David como un rival al que debía desplazar. Su amistad se manifestó en lealtad y apoyo. En una etapa difícil, Jonatán animó a David a seguir confiando en Jehová. Su ejemplo invita a alegrarnos por el bien de nuestros amigos.","sequence":["David y Jonatán se hacen amigos.","Jonatán demuestra su lealtad.","David atraviesa una etapa de persecución.","Jonatán lo anima a confiar en Jehová."],"clues":["Mi padre era rey, pero mi amistad no se basó en competir.","Apoyé a un amigo que atravesaba dificultades.","Fui un amigo leal de David y era hijo de Saúl."],"quizzes":[{"question":"¿Qué actitud caracteriza la amistad de Jonatán?","options":["Lealtad sin rivalidad.","Celos por los logros de David.","Interés solo por recibir regalos."],"correct":0,"id":"jonatan-1","explanation":"Jonatán era hijo del rey Saúl, pero no trató a David como un rival al que debía desplazar. Su amistad se manifestó en lealtad y apoyo. En una etapa difícil, Jonatán animó a David a seguir confiando en Jehová. Su ejemplo invita a alegrarnos por el bien de nuestros amigos.","reference":"1 Samuel 18:1–4; 23:16–18"},{"id":"jonatan-2","question":"¿Quién era el padre de Jonatán?","options":["Saúl.","Boaz.","Mardoqueo."],"correct":0,"explanation":"En esta lectura: Saúl. Consulta 1 Samuel 18:1–4; 23:16–18 para situarlo en su contexto.","reference":"1 Samuel 18:1–4; 23:16–18"},{"id":"jonatan-3","question":"¿Quién atravesaba una etapa de persecución?","options":["David.","Salomón.","Lidia."],"correct":0,"explanation":"En esta lectura: David. Consulta 1 Samuel 18:1–4; 23:16–18 para situarlo en su contexto.","reference":"1 Samuel 18:1–4; 23:16–18"},{"id":"jonatan-4","question":"¿A qué animó Jonatán a su amigo?","options":["A seguir confiando en Jehová.","A competir por recibir regalos.","A abandonar toda responsabilidad."],"correct":0,"explanation":"En esta lectura: A seguir confiando en Jehová. Consulta 1 Samuel 18:1–4; 23:16–18 para situarlo en su contexto.","reference":"1 Samuel 18:1–4; 23:16–18"},{"id":"jonatan-5","question":"¿Cómo trató Jonatán a David?","options":["Como a un amigo al que apoyar.","Como a un rival al que desplazar.","Como a alguien a quien evitar siempre."],"correct":0,"explanation":"En esta lectura: Como a un amigo al que apoyar. Consulta 1 Samuel 18:1–4; 23:16–18 para situarlo en su contexto.","reference":"1 Samuel 18:1–4; 23:16–18"}],"modern":{"context":"Amistades","situation":"Un amigo consigue una oportunidad que tú también deseabas.","options":["Felicitarlo sinceramente y seguir trabajando en tus propias metas.","Restarle importancia a su esfuerzo.","Alejarte sin explicarle qué te pasa."],"correct":0,"explanation":"La alegría por el bien de otro fortalece la amistad. Reconocer nuestros sentimientos también ayuda a no actuar por celos.","action":"Enviar un mensaje sincero de reconocimiento a un amigo.","talk":"¿Qué diferencia hay entre admirar a alguien y compararse constantemente con él?","responses":["Puedes felicitar a tu amigo y reconocer al mismo tiempo tu propia decepción. Ambas cosas pueden coexistir.","Restar importancia a su esfuerzo puede herir la amistad sin aliviar lo que sientes.","Alejarte sin explicarte puede generar confusión. Puedes tomarte tiempo y luego hablar con sinceridad."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"forest","bridge":{"past":"Jonatán lo anima a confiar en Jehová.","value":"Amistad","today":"Un amigo consigue una oportunidad que tú también deseabas.","action":"Enviar un mensaje sincero de reconocimiento a un amigo."}},{"id":"abigail","name":"Abigaíl","title":"Palabras que cambian el rumbo","era":"Reyes y profetas","place":"Región de Carmelo","value":"Autocontrol","reference":"1 Samuel 25:14–35","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/1-samuel/25/","source":"https://www.jw.org/es/biblioteca/libros/seamos-valientes-andar-dios/dias-reyes-reconstruccion-jerusalen/abigail-mujer-apago-furia-hombres/","image":"https://cms-imgp.jw-cdn.org/img/p/1102025924/univ/art/1102025924_univ_sqr_xl.jpg","summary":"Después de los insultos de Nabal, David reaccionó con furia. Abigaíl actuó con sensatez y le recordó las consecuencias de responder con violencia. David aceptó sus palabras y cambió de rumbo. La enseñanza no exige que una víctima confronte a una persona violenta: ante un peligro real, la prioridad es ponerse a salvo.","sequence":["Nabal rechaza e insulta a los mensajeros.","David se enfurece.","Abigaíl interviene con sensatez.","David escucha y desiste de vengarse."],"clues":["Mi intervención ayudó a evitar una tragedia.","No respondí a la furia con más furia.","David aceptó mi consejo después de los insultos de Nabal."],"quizzes":[{"question":"¿Qué hizo bien David al escuchar a Abigaíl?","options":["Aceptar el consejo y cambiar de decisión.","Insistir en su primera reacción.","Culpar a todos de sus emociones."],"correct":0,"id":"abigail-1","explanation":"Después de los insultos de Nabal, David reaccionó con furia. Abigaíl actuó con sensatez y le recordó las consecuencias de responder con violencia. David aceptó sus palabras y cambió de rumbo. La enseñanza no exige que una víctima confronte a una persona violenta: ante un peligro real, la prioridad es ponerse a salvo.","reference":"1 Samuel 25:14–35"},{"id":"abigail-2","question":"¿Qué desencadenó la ira de David?","options":["Los insultos de Nabal.","La pérdida de una cosecha.","Un mensaje de Nehemías."],"correct":0,"explanation":"En esta lectura: Los insultos de Nabal. Consulta 1 Samuel 25:14–35 para situarlo en su contexto.","reference":"1 Samuel 25:14–35"},{"id":"abigail-3","question":"¿Quién intervino con sensatez?","options":["Abigaíl.","Rahab.","Lidia."],"correct":0,"explanation":"En esta lectura: Abigaíl. Consulta 1 Samuel 25:14–35 para situarlo en su contexto.","reference":"1 Samuel 25:14–35"},{"id":"abigail-4","question":"¿Sobre qué le hizo reflexionar Abigaíl?","options":["Las consecuencias de responder con violencia.","Cómo conseguir más prestigio.","Cómo ocultar lo sucedido."],"correct":0,"explanation":"En esta lectura: Las consecuencias de responder con violencia. Consulta 1 Samuel 25:14–35 para situarlo en su contexto.","reference":"1 Samuel 25:14–35"},{"id":"abigail-5","question":"¿Cómo terminó la decisión de David en este episodio?","options":["Desistió de vengarse.","Insistió en actuar con furia.","Se negó a escuchar a nadie."],"correct":0,"explanation":"En esta lectura: Desistió de vengarse. Consulta 1 Samuel 25:14–35 para situarlo en su contexto.","reference":"1 Samuel 25:14–35"}],"modern":{"context":"Conversaciones","situation":"Recibes un mensaje que parece ofensivo y ya estás escribiendo una respuesta dura.","options":["Esperar, aclarar lo que quiso decir y responder con calma.","Reenviarlo para que todos se enfaden.","Contestar con un insulto más fuerte."],"correct":0,"explanation":"Una pausa permite considerar otras explicaciones y las consecuencias de nuestras palabras. En caso de amenazas, busca ayuda y no te expongas.","action":"Practicar: “Quiero entender lo que dijiste antes de responder”.","talk":"¿Qué nos ayuda a aceptar un consejo cuando estamos molestos?","responses":["Una pausa y una pregunta pueden aclarar un malentendido antes de responder. Si hay amenazas, la prioridad es protegerte.","Reenviar el mensaje para enfadar a otros puede ampliar el conflicto y afectar la privacidad.","Un insulto más fuerte puede escalar la discusión. Estar molesto no obliga a responder inmediatamente."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"desert","bridge":{"past":"David escucha y desiste de vengarse.","value":"Autocontrol","today":"Recibes un mensaje que parece ofensivo y ya estás escribiendo una respuesta dura.","action":"Practicar: “Quiero entender lo que dijiste antes de responder”."}},{"id":"salomon","name":"Salomón","title":"La mejor pregunta","era":"Reyes y profetas","place":"Jerusalén","value":"Sabiduría","reference":"1 Reyes 3:5–12","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/1-reyes/3/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/8/rey-salomon-templo/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016054/univ/art/1102016054_univ_sqr_xl.jpg","summary":"Al comenzar su reinado, Salomón reconoció que necesitaba ayuda para dirigir al pueblo. En lugar de pedir riqueza, solicitó capacidad para juzgar con sabiduría. El relato resalta el valor de reconocer nuestras limitaciones y buscar discernimiento antes de asumir una responsabilidad.","sequence":["Salomón asume el reinado.","Jehová le invita a expresar una petición.","Salomón pide sabiduría para juzgar.","Jehová responde a su petición."],"clues":["Fui rey después de David.","Mi petición no se centró en riquezas.","Pedí un corazón que escuchara para juzgar al pueblo."],"quizzes":[{"question":"¿Qué pidió Salomón en esta ocasión?","options":["Sabiduría para dirigir al pueblo.","Fama por encima de todo.","Una vida sin responsabilidades."],"correct":0,"id":"salomon-1","explanation":"Al comenzar su reinado, Salomón reconoció que necesitaba ayuda para dirigir al pueblo. En lugar de pedir riqueza, solicitó capacidad para juzgar con sabiduría. El relato resalta el valor de reconocer nuestras limitaciones y buscar discernimiento antes de asumir una responsabilidad.","reference":"1 Reyes 3:5–12"},{"id":"salomon-2","question":"¿Qué responsabilidad acababa de asumir Salomón?","options":["El reinado.","La venta de telas.","El cuidado del arca de Noé."],"correct":0,"explanation":"En esta lectura: El reinado. Consulta 1 Reyes 3:5–12 para situarlo en su contexto.","reference":"1 Reyes 3:5–12"},{"id":"salomon-3","question":"¿Quién invitó a Salomón a expresar una petición?","options":["Jehová.","El faraón.","Elí."],"correct":0,"explanation":"En esta lectura: Jehová. Consulta 1 Reyes 3:5–12 para situarlo en su contexto.","reference":"1 Reyes 3:5–12"},{"id":"salomon-4","question":"¿Qué reconoció Salomón al hacer su petición?","options":["Que necesitaba ayuda para dirigir.","Que ya lo sabía todo.","Que no tenía ninguna responsabilidad."],"correct":0,"explanation":"En esta lectura: Que necesitaba ayuda para dirigir. Consulta 1 Reyes 3:5–12 para situarlo en su contexto.","reference":"1 Reyes 3:5–12"},{"id":"salomon-5","question":"¿En qué quería usar la sabiduría?","options":["En juzgar y dirigir al pueblo.","En hacerse famoso a cualquier precio.","En evitar escuchar a los demás."],"correct":0,"explanation":"En esta lectura: En juzgar y dirigir al pueblo. Consulta 1 Reyes 3:5–12 para situarlo en su contexto.","reference":"1 Reyes 3:5–12"}],"modern":{"context":"Decisiones","situation":"Te proponen coordinar una actividad que nunca has organizado.","options":["Reconocer lo que necesitas aprender y pedir orientación.","Prometer que puedes hacerlo todo sin ayuda.","Ocultar tus dudas hasta el último día."],"correct":0,"explanation":"Pedir ayuda no resta valor a una responsabilidad; puede mejorar la manera de cumplirla.","action":"Anotar dos preguntas antes de tomar una decisión importante.","talk":"¿A quién podemos consultar cuando nos falta experiencia?","responses":["Pedir orientación te permite preparar una responsabilidad nueva con expectativas realistas.","Prometer hacerlo todo sin ayuda puede ocultar necesidades importantes hasta que aparezcan dificultades.","Guardar las dudas hasta el último día reduce el tiempo para recibir apoyo. Preguntar a tiempo facilita el trabajo."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"palace","bridge":{"past":"Jehová responde a su petición.","value":"Sabiduría","today":"Te proponen coordinar una actividad que nunca has organizado.","action":"Anotar dos preguntas antes de tomar una decisión importante."}},{"id":"viuda","name":"La viuda de Sarepta","title":"Lo pequeño también ayuda","era":"Reyes y profetas","place":"Sarepta","value":"Generosidad","reference":"1 Reyes 17:8–16","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/1-reyes/17/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/8/viuda-sarepta-elias/","image":"https://cms-imgp.jw-cdn.org/img/p/1102016058/univ/art/1102016058_univ_sqr_xl.jpg","summary":"En un tiempo de escasez, una viuda de Sarepta recibió a Elías. Aunque tenía muy poco alimento, actuó de acuerdo con el mensaje que él le transmitió. El relato cuenta que Jehová mantuvo su provisión de harina y aceite. No es una promesa de que dar dinero o bienes hoy produzca una recompensa material.","sequence":["Hay escasez de alimento.","Elías llega a Sarepta.","La viuda prepara alimento con lo poco que tiene.","La harina y el aceite no se agotan durante la escasez."],"clues":["Vivía fuera de Israel y atravesaba una época de escasez.","Compartí alimento con un profeta.","Mi harina y mi aceite no se agotaron mientras hospedaba a Elías."],"quizzes":[{"question":"¿Qué dos provisiones menciona este relato?","options":["Harina y aceite.","Oro y plata.","Uvas y miel."],"correct":0,"id":"viuda-1","explanation":"En un tiempo de escasez, una viuda de Sarepta recibió a Elías. Aunque tenía muy poco alimento, actuó de acuerdo con el mensaje que él le transmitió. El relato cuenta que Jehová mantuvo su provisión de harina y aceite. No es una promesa de que dar dinero o bienes hoy produzca una recompensa material.","reference":"1 Reyes 17:8–16"},{"id":"viuda-2","question":"¿Dónde vivía la viuda de este relato?","options":["En Sarepta.","En Filipos.","En Susa."],"correct":0,"explanation":"En esta lectura: En Sarepta. Consulta 1 Reyes 17:8–16 para situarlo en su contexto.","reference":"1 Reyes 17:8–16"},{"id":"viuda-3","question":"¿Quién llegó a visitarla durante la escasez?","options":["Elías.","Pablo.","Moisés."],"correct":0,"explanation":"En esta lectura: Elías. Consulta 1 Reyes 17:8–16 para situarlo en su contexto.","reference":"1 Reyes 17:8–16"},{"id":"viuda-4","question":"¿En qué situación se encontraba su alimento?","options":["Le quedaba muy poco.","Tenía reservas para una ciudad.","No había escasez en su región."],"correct":0,"explanation":"En esta lectura: Le quedaba muy poco. Consulta 1 Reyes 17:8–16 para situarlo en su contexto.","reference":"1 Reyes 17:8–16"},{"id":"viuda-5","question":"Según el relato, ¿qué ocurrió con sus provisiones?","options":["La harina y el aceite no se agotaron durante la escasez.","Se convirtieron en oro.","Fueron trasladadas al palacio de Egipto."],"correct":0,"explanation":"En esta lectura: La harina y el aceite no se agotaron durante la escasez. Consulta 1 Reyes 17:8–16 para situarlo en su contexto.","reference":"1 Reyes 17:8–16"}],"modern":{"context":"Comunidad","situation":"Te gustaría ayudar a un vecino, pero no tienes dinero para un regalo.","options":["Preguntar si puedes ayudar con una tarea o dedicarle tiempo.","Pensar que sin dinero no se puede ayudar.","Prometer un regalo que no puedes costear."],"correct":0,"explanation":"La generosidad también puede expresarse con tiempo, atención y habilidades. Debe respetar las necesidades y posibilidades de todos.","action":"Ofrecer una ayuda pequeña y concreta sin esperar nada a cambio.","talk":"¿Qué ayuda sin costo has recibido y todavía recuerdas?","responses":["Una tarea o un rato de atención puede ucciones no eran lo que esperaba. Sus servidores lo animaron a reconsiderarlas. Finalmente se sumergió siete veces en el Jordán y, según el relato, fue curado. Este episodio no sustituye la atención médica actual.","reference":"2 Reyes 5:1–15"},{"id":"naaman-2","question":"¿Quién habló inicialmente de Eliseo?","options":["Una niña israelita.","Un mercader de Filipos.","El rey de Nínive."],"correct":0,"explanation":"En esta lectura: Una niña israelita. Consulta 2 Reyes 5:1–15 para situarlo en su contexto.","reference":"2 Reyes 5:1–15"},{"id":"naaman-3","question":"¿Quiénes animaron a Naamán a reconsiderar su reacción?","options":["Sus servidores.","Los hermanos de José.","Los viajeros de Jericó."],"correct":0,"explanation":"En esta lectura: Sus servidores. Consulta 2 Reyes 5:1–15 para situarlo en su contexto.","reference":"2 Reyes 5:1–15"},{"id":"naaman-4","question":"¿En qué río siguió las instrucciones?","options":["En el Jordán.","En el Nilo.","En el Éufrates."],"correct":0,"explanation":"En esta lectura: En el Jordán. Consulta 2 Reyes 5:1–15 para situarlo en su contexto.","reference":"2 Reyes 5:1–15"},{"id":"naaman-5","question":"¿Cuántas veces se sumergió según el relato?","options":["Siete.","Dos.","Doce."],"correct":0,"explanation":"En esta lectura: Siete. Consulta 2 Reyes 5:1–15 para situarlo en su contexto.","reference":"2 Reyes 5:1–15"}],"modern":{"context":"Trabajo","situation":"Una persona con menos experiencia te señala un error que cometiste.","options":["Revisar lo que dice y agradecer la observación.","Descartarlo solo por su edad o experiencia.","Cambiar de tema para que nadie lo note."],"correct":0,"explanation":"Una sugerencia puede ser útil aunque venga de alguien inesperado. Revisar la información vale más que defender el orgullo.","action":"Practicar una respuesta agradecida ante una corrección.","talk":"¿Qué nos cuesta más: equivocarnos o reconocerlo?","responses":["Revisar la observación permite aprender por su contenido, no por la edad de qui  la generosidad como una fórmula para obtener milagros.","sequence":["La multitud necesita alimento.","Se identifican cinco panes y dos pescados.","Jesús da gracias y se distribuye la comida.","Se recogen las sobras."],"clues":["En este relato una multitud necesitaba comer.","Había cinco panes y dos pescados.","¿Quién realizó el milagro con el que todos comieron?"],"quizzes":[{"question":"¿Qué hicieron después de que todos comieran?","options":["Recogieron las sobras.","Tiraron lo que quedaba.","Vendieron las canastas vacías."],"correct":0,"id":"panes-1","explanation":"Una gran multitud necesitaba alimento. Había cinco panes y dos pescados, una cantidad insuficiente para tanta gente. Jesús dio gracias y el relato describe cómo todos pudieron comer. Después se recogieron las sobras. El episodio permite reflexionar sobre compartir y no desperdiciar, sin presentar la generosidad como una fórmula para obtener milagros.","reference":"Juan 6:1–13"},{"id":"panes-2","question":"¿Qué cantidad de alimento se identificó inicialmente?","options":["Cinco panes y dos pescados.","Dos panes y cinco pescados.","Cien cestas llenas."],"correct":0,"explanation":"En esta lectura: Cinco panes y dos pescados. Consulta Juan 6:1–13 para situarlo en su contexto.","reference":"Juan 6:1–13"},{"id":"panes-3","question":"¿Qué hizo Jesús antes de distribuir el alimento?","options":["Dio gracias.","Pidió a todos que se fueran.","Escondió la comida."],"correct":0,"explanation":"En esta lectura: Dio gracias. Consulta Juan 6:1–13 para situarlo en su contexto.","reference":"Juan 6:1–13"},{"id":"panes-4","question":"¿Qué ocurrió con la multitud según el relato?","options":["Todos pudieron comer.","Solo comieron los primeros cinco.","Nadie recibió alimento."],"correct":0,"explanation":"En esta lectura: Todos pudieron comer. Consulta Juan 6:1–13 para situarlo en su contexto.","reference":"Juan 6:1–13"},{"id":"panes-5","question":"¿Qué se hizo con las sobras?","options":["Se recogieron.","Se tiraron sin r ete.","Construyó una muralla."],"correct":0,"explanation":"En esta lectura: Oró. Consulta Hechos 9:36–42 para situarlo en su contexto.","reference":"Hechos 9:36–42"}],"modern":{"context":"Comunidad","situation":"Tienes una habilidad sencilla y no crees que pueda ayudar a nadie.","options":["Preguntar quién podría beneficiarse y ofrecer ayuda concreta.","Compararte hasta dejar de intentarlo.","Esperar a ser perfecto antes de colaborar."],"correct":0,"explanation":"Una habilidad cotidiana puede tener mucho valor para quien necesita ayuda. Lo importante no es impresionar.","action":"Ofrecer una habilidad: explicar, reparar, cocinar o acompañar.","talk":"¿Qué talentos de nuestra familia podríamos usar para cuidar a alguien?","responses":["Preguntar qué ayuda hace falta puede dar utilidad a una habilidad que para ti parece pequeña.","Compararte constantemente puede ocultar lo que ya sabes aportar. La ayuda no es una competición.","Esperar a ser perfecto puede posponer una ayuda sencilla que ya podrías ofrecer."],"line":"Piensa cómo expresarías tu respuesta con tus propias palabras."},"scene":"coast","bridge":{"past":"Pedro ora y Dorcas vuelve a vivir.","value":"Bondad","today":"Tienes una habilidad sencilla y no crees que pueda ayudar a nadie.","action":"Ofrecer una habilidad: explicar, reparar, cocinar o acompañar."}},{"id":"lidia","name":"Lidia","title":"Una puerta abierta","era":"Primeros discípulos","place":"Filipos","value":"Hospitalidad","reference":"Hechos 16:11–15, 40","bible":"https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/hechos/16/","source":"https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/14/carcelero-aprende-verdad/","image":"https://wol.jw.org/es/wol/mp/r4/lp-s/nwtsty/2026/889","summary":"En Filipos, Pablo habló con unas mujeres reunidas junto a un río. Lidia, vendedora de púrpura, prestó atención al mensaje. Después de bautizarse con los de su casa, ofreció hospitalidad a Pablo y a sus compañeros. Su ejemplo conecta la ate {kind:'Biblia',title:'Vuelve al texto',text:`Compara la situación actual con ${s.reference}.`,url:s.bible},

{kind:'WOL',title:'Explora más sobre Jonás',text:'Búsqueda temática completa en la Biblioteca en Línea.',url:'https://wol.jw.org/es/wol/s/r4/lp-s?q=jon%C3%A1s'},
{kind:'Relato',title:'Jehová es paciente con Jonás',text:'Relato que destaca la paciencia y la misericordia.',url:'https://www.jw.org/es/biblioteca/libros/lecciones-historias-biblia/9/jonas/'},
{kind:'Biblia',title:'Jonás entra en Nínive',text:'Lee Jonás 3 y observa qué hicieron los habitantes al escuchar el mensaje.',url:'https://www.jw.org/es/biblioteca/biblia/biblia-estudio/libros/Jon%C3%A1s/3/'},

function award(n){const before=state.level;state.points+=n;state.level=1+Math.floor(state.points/900);save();updateHud();if(state.level>before)levelUp()}
function unlockReward(index,phase){const pool=rewardPool(state.story,phase);const r=pool[index%pool.length];const id=`${state.story.id}:${phase}:${index}`;if(!state.codex.some(x=>x.id===id)){state.codex.push({...r,id,story:state.story.name,phase});award(phase==='modern'?150:100)}showReward(r,phase);save()}
function showReward(r,phase){let el=document.getElementById('reward');if(!el){el=document.createElement('aside');el.id='reward';el.className='reward';document.getElementById('game')?.appendChild(el)}el.innerHTML=`<div class="rhead"><div class="pearl-icon"></div><div><small>${esc(r.kind)} · ${phase==='modern'?'ECO ACTUAL':'DESCUBRIMIENTO'}</small><h3>${esc(r.title)}</h3></div></div><p>${esc(r.text)}</p><div class="actions"><a class="btn primary" href="${r.url}" target="_blank" rel="noopener">Abrir JW/WOL ↗</a><button class="btn ghost" id="rewardClose">Seguir</button></div>`;requestAnimationFrame(()=>el.classList.add('show'));clearTimeout(showReward.t);showReward.t=setTimeout(()=>el.classList.remove('show'),6500);document.getElementById('rewardClose').onclick=()=>el.classList.remove('show')}
function updateHud(){const p=document.getElementById('pts'),l=document.getElementById('lvl'),c=document.getElementById('codexN'),x=document.getElementById('xp');if(p)p.textContent=state.points.toLocaleString('es-ES');if(l)l.textContent=state.level;if(c)c.textContent=state.codex.length;if(x)x.style.width=((state.points%900)/900*100)+'%'}

function timelineChallenge(done){game?.pause(true);const items=state.story.sequence.map((text,i)=>({text,i})).sort(()=>Math.random()-.5);const o=document.createElement('div');o.className='overlay';o.innerHTML=`<section class="panel"><div class="eyebrow">Archivo de memoria</div><h2>Reconstruye el relato</h2><p>Arrastra los acontecimientos hasta colocarlos en el orden correcto. Todo pertenece al mismo relato.</p><div class="timeline" id="tl">${items.map(it=>`<div class="timeline-item" draggable="true" data-i="${it.i}">☷ &nbsp; ${esc(it.text)}</div>`).join('')}</div><div class="actions"><button class="btn primary" id="checkTl">Comprobar</button><button class="btn ghost" id="cancelTl">Volver al mundo</button></div><div id="tlFb"></div></section>`;document.getElementById('game').appendChild(o);let src=null;document.querySelectorAll('.timeline-item').forEach(t=>{t.ondragstart=()=>{src=t;t.classList.add('drag')};t.ondragend=()=>t.classList.remove('drag');t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();if(src&&src!==t){const b=document.getElementById('tl'),nodes=[...b.children],a=nodes.indexOf(src),bi=nodes.indexOf(t);b.insertBefore(src,a<bi?t.nextSibling:t)}}});document.getElementById('checkTl').onclick=()=>{const ok=[...document.querySelectorAll('.timeline-item')].every((t,i)=>Number(t.dataset.i)===i);if(ok){document.getElementById('tlFb').innerHTML=`<p style="color:var(--teal);font-weight:900">Relato reconstruido. +400 puntos</p>`;award(400);setTimeout(()=>{o.remove();game?.pause(false);done()},700)}else document.getElementById('tlFb').innerHTML='<p style="color:#ff9a9a">Aún hay acontecimientos fuera de orden.</p>'};document.getElementById('cancelTl').onclick=()=>{o.remove();game?.pause(false)}}
function memoryGate(done){game?.pause(true);let idx=1,hp=4;const o=document.createElement('div');o.className='overlay';o.innerHTML=`<section class="panel"><div class="eyebrow">Puerta de memoria</div><h2>Demuestra que comprendiste</h2><p>Cuatro preguntas del mismo relato. Cada acierto rompe un sello.</p><div id="mem"></div></section>`;document.getElementById('game').appendChild(o);function render(){const q=state.story.quizzes[idx];if(!q){award(500);o.remove();game?.pause(false);done();return}document.getElementById('mem').innerHTML=`<div class="stat">Sellos restantes <b>${hp}</b></div><h3 style="font-size:22px">${esc(q.question)}</h3><div class="answers">${q.options.map((x,i)=>`<button class="answer" data-i="${i}">${String.fromCharCode(65+i)} · ${esc(x)}</button>`).join('')}</div><div id="memFb"></div>`;document.querySelectorAll('#mem .answer').forEach(b=>b.onclick=()=>{if(Number(b.dataset.i)===q.correct){b.classList.add('good');document.getElementById('memFb').innerHTML=`<p style="color:#b9c7d3">${esc(q.explanation)}</p>`;idx++;hp--;setTimeout(render,700)}else{b.classList.add('bad');document.getElementById('memFb').innerHTML='<p style="color:#ffaaaa">Ese sello no cedió. Revisa el relato e inténtalo otra vez.</p>'}})}render()}
function openCurrentBridge(done){game?.pause(true);const o=document.createElement('div');o.className='overlay';o.innerHTML=`<section class="panel"><div class="eyebrow">Pasado ↔ presente</div><h2>${esc(state.story.value)}</h2><p><b>Entonces:</b> ${esc(state.story.bridge?.past||state.story.summary)}</p><p><b>Hoy:</b> ${esc(state.story.modern.situation)}</p><p>${esc(state.story.modern.talk)}</p><div class="actions"><button class="btn primary" id="bridgeDone">Seguir la misión</button><a class="btn ghost" href="${state.story.source}" target="_blank" rel="noopener">Revisar fuente ↗</a></div></section>`;document.getElementById('game').appendChild(o);document.getElementById('bridgeDone').onclick=()=>{o.remove();game?.pause(false);award(300);done()}}
function modernDecision(){game?.pause(true);const m=state.story.modern;const o=document.createElement('div');o.className='overlay';o.innerHTML=`<section class="panel"><div class="eyebrow">Misión final · actualidad</div><h2>¿Qué harías?</h2><p style="font-size:21px;color:white;font-weight:800">${esc(m.situation)}</p><div class="answers">${m.options.map((x,i)=>`<button class="answer" data-i="${i}">${String.fromCharCode(65+i)} · ${esc(x)}</button>`).join('')}</div><div id="decFb"></div></section>`;document.getElementById('game').appendChild(o);document.querySelectorAll('.answer',o).forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i),ok=i===m.correct;document.querySelectorAll('.answer',o).forEach(x=>x.disabled=true);b.classList.add(ok?'good':'bad');document.getElementById('decFb').innerHTML=`<p><b>Posible consecuencia:</b> ${esc(m.responses?.[i]||m.explanation)}</p><div class="actions"><button class="btn primary" id="finishNow">Cerrar misión</button></div>`;award(ok?600:350);document.getElementById('finishNow').onclick=()=>{o.remove();game?.destroy();finalScreen()}})}
function portalTransition(){game?.pause(true);const f=document.createElement('div');f.className='portal-fx';f.innerHTML=`<div><div class="eyebrow">Misión antigua completada</div><h2>ENTONCES<br>→ HOY</h2><p style="text-align:center">Te llevas contigo: <b>${esc(state.story.value)}</b></p></div>`;document.getElementById('game').appendChild(f);award(700);setTimeout(()=>{game?.destroy();startGame('modern')},2200)}
function finalScreen(){const s=state.story,m=s.modern,bg=s.modernImage||DATA.modernImages[m.context]||s.image;app.innerHTML=`<section class="final"><img class="bg" src="${bg}" alt=""><div class="debrief"><div class="eyebrow">Debrief de misión · ${esc(s.name)}</div><h1>Lo que te llevas.</h1><div class="learning"><b>${esc(s.value)}:</b> ${esc(m.explanation)}</div><div class="journal"><label>¿Qué aprendí realmente?<textarea id="n1">${esc(state.notes.learn)}</textarea></label><label>¿Dónde puedo aplicarlo?<textarea id="n2">${esc(state.notes.apply)}</textarea></label><label>¿Qué acción haré y cuándo?<textarea id="n3">${esc(state.notes.when)}</textarea></label></div><div class="stats"><div class="stat">Puntos <b>${state.points.toLocaleString('es-ES')}</b></div><div class="stat">Nivel <b>${state.level}</b></div><div class="stat">Códice <b>${state.codex.length}</b></div></div><div class="actions"><button class="btn primary" id="saveFinal">Guardar reflexión</button><button class="btn" id="again">Repetir expedición</button><button class="btn ghost" id="other">Elegir otro relato</button></div><div class="footer">Relato: ${esc(s.reference)} · <a href="${s.source}" target="_blank" rel="noopener">publicación de origen en JW.ORG/WOL</a>. Las escenas y situaciones actuales del juego son recreaciones educativas; no pretenden ser reconstrucciones arqueológicas exactas.</div></div></section>`;document.getElementById('saveFinal').onclick=()=>{state.notes={learn:document.getElementById('n1').value,apply:document.getElementById('n2').value,when:document.getElementById('n3').value};save();document.getElementById('saveFinal').textContent='Guardado ✓'};document.getElementById('again').onclick=()=>{resetStory();startGame('ancient')};document.getElementById('other').onclick=selectStory}
title();
</script>
</body></html>
