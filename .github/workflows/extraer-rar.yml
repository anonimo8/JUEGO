
      - name: Descomprimir ZIP en MAIN
        run: |
          echo "Buscando archivo ZIP..."

          ARCHIVE=$(find . -type f -iname "Caminos_de_Fe_V25_1_LISTO_CLOUDFLARE_GIT.zip" -not -path "./.git/*" -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No se encontro el ZIP"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Archivo encontrado: $ARCHIVE"

          sudo apt-get update
          sudo apt-get install -y unzip

          unzip -o "$ARCHIVE" -d .

          echo "ZIP descomprimido correctamente"



      - name: Guardar archivos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extraer archivos RAR"
          git push
