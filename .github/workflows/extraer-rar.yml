
name: Extraer archivo RAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Descomprimir RAR
        run: |
          7z x "Caminos_de_Fe_V25_COMPLETO_PERSONAJES_UNICOS.rar" -o./ -y

      - name: Guardar archivos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extraer archivos RAR"
          git push
