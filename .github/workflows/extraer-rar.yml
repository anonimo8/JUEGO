
name: Extraer archivo RAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

     
      - name: Buscar y descomprimir RAR
        run: |
          echo "Buscando archivo RAR..."
          find . -type f

          ARCHIVE=$(find . -type f -iname "*.rar" -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No se encontró ningún archivo RAR"
            exit 1
          fi

          echo "Archivo encontrado: $ARCHIVE"

          mkdir -p extraido

          7z x "$ARCHIVE" -o./extraido -y

          echo "Extracción completada"


      - name: Mover todo a la raiz de MAIN
        run: |
          find extraido -mindepth 1 -maxdepth 1 -exec mv -t . -- {} +
          rmdir extraido


      - name: Guardar archivos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extraer archivos RAR"
          git push
